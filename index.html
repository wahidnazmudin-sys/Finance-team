    // =========================================================================
    // 3. HELPERS

    function formatIDR(num) {
      return new Intl.NumberFormat('id-ID', { style:'currency', currency:'IDR', minimumFractionDigits:0, maximumFractionDigits:0 }).format(num || 0);
    }
    function getCurrentOrg() { return DB.organizations.find(o => o.id === DB.activeOrgId) || DB.organizations[0]; }
    function getCurrentRole() { return ROLE_DEFINITIONS[DB.activeRoleCode]; }
    function hasPermission(permCode) {
      const role = getCurrentRole();
      if (!role) return false;
      return role.permissions.includes('*') || role.permissions.includes(permCode);
    }
    function hasPlanFeature(key) {
      const org = getCurrentOrg();
      const plan = SUBSCRIPTION_PLANS[org.planCode] || SUBSCRIPTION_PLANS.free;
      return Boolean(plan.features[key]);
    }
    function getOrgAccounts() { return DB.accounts.filter(a => a.organization_id === DB.activeOrgId); }
    function getOrgTransactions() { return DB.transactions.filter(t => t.organization_id === DB.activeOrgId); }
    function getOrgTransfers() { return DB.transfers.filter(tr => tr.organization_id === DB.activeOrgId); }
    function getOrgProjects() { return DB.projects.filter(p => p.organization_id === DB.activeOrgId); }
    function getOrgInvoices() { return DB.invoices.filter(i => i.organization_id === DB.activeOrgId); }
    function getOrgBudgets() { return DB.budgets.filter(b => b.organization_id === DB.activeOrgId); }
    function getOrgAuditLogs() { return DB.auditLogs.filter(l => l.organization_id === DB.activeOrgId); }

    function computeAccountBalance(accountId) {
      const acc = DB.accounts.find(a => a.id === accountId);
      if (!acc) return 0;
      let bal = acc.openingBalance;
      DB.transactions
        .filter(t => t.organization_id === acc.organization_id && t.accountId === accountId && t.status === 'Approved')
        .forEach(t => { bal += t.type === 'income' ? t.amount : -t.amount; });
      DB.transfers
        .filter(tr => tr.organization_id === acc.organization_id)
        .forEach(tr => {
          if (tr.fromAccountId === accountId) bal -= tr.amount;
          if (tr.toAccountId === accountId) bal += tr.amount;
        });
      return bal;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error:   'bg-rose-900 text-white border-rose-700',
        warning: 'bg-amber-900 text-white border-amber-700',
        info:    'bg-[#0B132B] text-white border-slate-700'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto rounded-xl border px-4 py-3 text-xs sm:text-sm font-medium shadow-lg transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'translateY(0)'; });
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 300);
      }, 3600);
    }

    function logAudit(action, detail) {
      const role = getCurrentRole();
      DB.auditLogs.unshift({
        id: 'aud_' + Date.now(),
        organization_id: DB.activeOrgId,
        timestamp: new Date().toLocaleDateString('id-ID') + ' ' + new Date().toTimeString().slice(0, 5) + ' WIB',
        actor: role.userName, action, detail
      });
    }

      renderApp();

    function switchActiveUserRole(roleCode) {
      DB.activeRoleCode = roleCode;

      if (nav && nav.permission && !hasPermission(nav.permission)) DB.currentRoute = 'dashboard';
      if (DB.currentRoute === 'settings' && !hasPermission('settings.view')) DB.currentRoute = 'dashboard';
      showToast(`Peran aktif diubah menjadi: ${getCurrentRole().name}`, 'info');
      renderApp();

    function renderShell() {
      const org = getCurrentOrg();
      const role = getCurrentRole();
      const plan = SUBSCRIPTION_PLANS[org.planCode] || SUBSCRIPTION_PLANS.free;
      const pendingCount = getOrgTransactions().filter(t => t.status === 'Pending Approval').length;

      document.getElementById('org-switcher').innerHTML = DB.organizations
        .map(o => `<option value="${o.id}" ${o.id === DB.activeOrgId ? 'selected' : ''}>${o.name}</option>`).join('');
      document.getElementById('role-switcher').value = DB.activeRoleCode;

      document.getElementById('sidebar-org-name').textContent = org.name;
      document.getElementById('sidebar-plan-badge').textContent = plan.name;
      document.getElementById('sidebar-role-label').textContent = role.name;

      const dot = document.getElementById('pending-badge-dot');
      if (pendingCount > 0) { dot.textContent = pendingCount; dot.classList.remove('hidden'); }
      else dot.classList.add('hidden');

      // Permission-filtered nav
      const visibleNav = NAV_ITEMS.filter(item => !item.permission || hasPermission(item.permission));

      // Notification dropdown content

      document.getElementById('notif-dropdown').innerHTML = `
        <div class="px-4 py-3 border-b border-slate-200 bg-slate-50 flex items-center justify-between">

              <div class="text-[11px] text-slate-600 truncate">${t.description}</div>

        'Draft':'bg-slate-100 text-slate-700 border-slate-200',
        'Rejected':'bg-rose-50 text-rose-700 border-rose-200',
        'Overdue':'bg-rose-50 text-rose-700 border-rose-200',
        'Reversed':'bg-purple-50 text-purple-700 border-purple-200',

        .filter(i => ['Sent','Partially Paid','Overdue'].includes(i.status))

            <div class="text-xs font-medium text-slate-500">Total Saldo Kas & Bank</div>
            <div class="mt-2 text-xl sm:text-2xl font-bold text-[#0B132B] tabular-currency">${formatIDR(totalCashBank)}</div>
            <div class="mt-2 text-[11px] text-slate-500">${accounts.length} rekening aktif terpantau</div>

                <div class="flex justify-between text-xs mb-1.5">
                  <span class="font-medium text-rose-700">Pengeluaran</span>
                  <span class="font-bold text-slate-900 tabular-currency">${formatIDR(totalExpense)}</span>

                  </div>

        </div>
      `;

    // ---- TRANSACTIONS ----
    function buildTransactionRows() {
      let txs = getOrgTransactions();
      if (DB.txFilterStatus !== 'ALL') txs = txs.filter(t => t.status === DB.txFilterStatus);
      if (DB.txSearch.trim()) {
        const q = DB.txSearch.toLowerCase();
        txs = txs.filter(t => t.description.toLowerCase().includes(q) || t.reference.toLowerCase().includes(q) || t.category.toLowerCase().includes(q));
      }
      if (txs.length === 0) return `<tr><td colspan="7" class="py-8 text-center text-slate-500 text-sm">Tidak ada transaksi yang sesuai filter.</td></tr>`;
      return txs.map(t => {
        const acc = DB.accounts.find(a => a.id === t.accountId);
        const canEdit = hasPermission('transactions.create') && ['Draft','Rejected'].includes(t.status);
        return `
          <tr class="hover:bg-slate-50/70">
            <td class="py-3.5 px-4 whitespace-nowrap">
              <div class="font-semibold text-slate-900">${t.date}</div>
              <div class="text-[11px] font-mono text-slate-400">${t.reference}</div>
            </td>
            <td class="py-3.5 px-4">
              <div class="font-medium text-slate-900">${t.description}</div>
              <div class="text-[11px] text-slate-500">${t.category}</div>
              ${t.rejectionReason ? `<div class="mt-1 text-[11px] text-rose-600 font-medium">Alasan Penolakan: ${t.rejectionReason}</div>` : ''}
            </td>
            <td class="py-3.5 px-4 whitespace-nowrap text-xs text-slate-600">${acc ? acc.name : '-'}</td>
            <td class="py-3.5 px-4 whitespace-nowrap text-xs text-slate-600">${t.createdByName}</td>
            <td class="py-3.5 px-4 whitespace-nowrap">${renderStatusBadge(t.status)}</td>
            <td class="py-3.5 px-4 text-right font-bold tabular-currency whitespace-nowrap ${t.type === 'income' ? 'text-emerald-700' : 'text-rose-700'}">
              ${t.type === 'income' ? '+' : '-'}${formatIDR(t.amount)}
            </td>
            <td class="py-3.5 px-4 text-right whitespace-nowrap">
              ${canEdit ? `
                <button onclick="openEditTransactionModal('${t.id}')" class="rounded-lg border border-slate-300 bg-white px-2.5 py-1 text-[11px] font-semibold text-slate-700 hover:bg-slate-50 mr-1">Edit</button>
                <button onclick="deleteTransaction('${t.id}')" class="rounded-lg border border-rose-300 bg-white px-2.5 py-1 text-[11px] font-semibold text-rose-700 hover:bg-rose-50">Hapus</button>
              ` : '<span class="text-[11px] text-slate-400">—</span>'}
            </td>
          </tr>`;
      }).join('');
    }

    function renderTransactions() {
      return `

    function refreshTxTable() {
      const tbody = document.getElementById('tx-table-body');
      if (!tbody) { renderApp(); return; }
      tbody.innerHTML = buildTransactionRows();
      // re-render filter buttons active state
      document.querySelectorAll('[onclick^="DB.txFilterStatus"]').forEach(b => {
        const match = b.getAttribute('onclick').match(/DB\.txFilterStatus='([^']+)'/);
        if (match) {
          const st = match[1];
          if (st === DB.txFilterStatus) b.className = 'rounded-lg px-3 py-1.5 text-xs font-semibold transition bg-[#0B132B] text-white';
          else b.className = 'rounded-lg px-3 py-1.5 text-xs font-semibold transition bg-slate-100 text-slate-600 hover:bg-slate-200';
        }
      });
    }

    function openNewTransactionModal(txId = null) {

      const requiresApproval = hasPlanFeature('approvalWorkflow');
      const tx = txId ? DB.transactions.find(t => t.id === txId) : null;

      openModal(`
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Nominal (IDR) *</label>
              <input id="tx-amount" type="number" min="1000" step="100" required value="${tx ? tx.amount : ''}" placeholder="5000000" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm tabular-currency" />
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Kategori *</label>
              <select id="tx-category" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm">
                ${['Pendapatan Jasa Proyek','Penjualan Produk','Infrastruktur Cloud & Domain','Gaji & Tenaga Ahli','Pemasaran & Akuisisi Klien','Operasional Kantor'].map(c => `<option ${tx && tx.category === c ? 'selected' : ''}>${c}</option>`).join('')}

          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Deskripsi Transaksi *</label>
            <input id="tx-desc" type="text" required value="${tx ? tx.description.replace(/"/g, '&quot;') : ''}" placeholder="Contoh: Pembayaran vendor server bulan November" class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm" />
          </div>
          <div class="rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs text-slate-600">

              ? `<strong>Alur Persetujuan Aktif (Paket ${SUBSCRIPTION_PLANS[org.planCode].name}):</strong> Transaksi baru akan berstatus <em>Pending Approval</em>.`
              : `<strong>Paket ${SUBSCRIPTION_PLANS[org.planCode].name}:</strong> Transaksi langsung dicatat sebagai <em>Approved</em>.`}

          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="rounded-xl border border-slate-300 px-4 py-2 text-xs font-semibold text-slate-700">Batal</button>

      `);

    function submitTransaction(e, editId) {
      e.preventDefault();
      const role = getCurrentRole();
      const requiresApproval = hasPlanFeature('approvalWorkflow');
      const status = requiresApproval ? 'Pending Approval' : 'Approved';
      const payload = {
        type: document.getElementById('tx-type').value,
        category: document.getElementById('tx-category').value,
        amount: Number(document.getElementById('tx-amount').value),
        description: document.getElementById('tx-desc').value,
        accountId: document.getElementById('tx-account').value,
        projectId: document.getElementById('tx-project').value
      };

      if (editId) {
        const tx = DB.transactions.find(t => t.id === editId && t.organization_id === DB.activeOrgId);
        Object.assign(tx, payload, {
          status, rejectionReason: undefined,
          approvedBy: status === 'Approved' ? role.userId : null,
          approvedByName: status === 'Approved' ? role.userName : null,
          approvedAt: status === 'Approved' ? 'Langsung (Auto-Approved)' : null
        });
        logAudit('transaction.updated', `Memperbarui transaksi ${tx.reference} (${formatIDR(tx.amount)})`);
        showToast(`Transaksi ${tx.reference} diperbarui.`, 'success');
      } else {
        const refNum = 'TRX-' + new Date().getFullYear() + String(new Date().getMonth() + 1).padStart(2, '0') + '-' + String(DB.transactions.length + 101).padStart(3, '0');
        const newTx = {
          id: 'tx_' + Date.now(), organization_id: DB.activeOrgId, date: new Date().toLocaleDateString('id-ID'),
          reference: refNum, ...payload, status, createdBy: role.userId, createdByName: role.userName,
          approvedBy: status === 'Approved' ? role.userId : null,
          approvedByName: status === 'Approved' ? role.userName : null,
          approvedAt: status === 'Approved' ? 'Langsung (Auto-Approved)' : null
        };
        DB.transactions.unshift(newTx);
        logAudit('transaction.created', `Membuat transaksi ${refNum} (${formatIDR(newTx.amount)}) dengan status ${status}`);
        showToast(status === 'Pending Approval' ? `Transaksi ${refNum} diajukan ke Pusat Persetujuan.` : `Transaksi ${refNum} berhasil dicatat.`, 'success');
      }
      closeModal();
      renderApp();
    }

    function openEditTransactionModal(txId) { openNewTransactionModal(txId); }

    function deleteTransaction(txId) {
      const tx = DB.transactions.find(t => t.id === txId);
      if (!tx) return;
      confirmDialog('Hapus Transaksi', `Anda akan menghapus <strong>${tx.reference}</strong> (${formatIDR(tx.amount)}). Tindakan ini tidak dapat dibatalkan.`, () => {
        DB.transactions = DB.transactions.filter(t => t.id !== txId);
        logAudit('transaction.deleted', `Menghapus transaksi ${tx.reference}`);
        showToast(`Transaksi ${tx.reference} dihapus.`, 'warning');
        renderApp();
      }, 'Ya, Hapus');
    }

    function exportTransactionsCSV() {
      const txs = getOrgTransactions();
      const headers = ['Tanggal','Referensi','Jenis','Kategori','Deskripsi','Status','Nominal_IDR'];
      const rows = txs.map(t => [t.date, t.reference, t.type, `"${t.category}"`, `"${t.description.replace(/"/g,'""')}"`, t.status, t.amount]);
      const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url;
      a.download = `terlahir-finance-transaksi-${getCurrentOrg().slug}.csv`; a.click();
      URL.revokeObjectURL(url);
      showToast('File CSV transaksi berhasil diunduh.', 'success');
    }

                          ${renderStatusBadge(t.status)}
                        </div>
                        <div class="text-sm font-bold text-slate-900">${t.description}</div>
                        <div class="text-xs text-slate-600">Kategori: <strong>${t.category}</strong> • Diajukan oleh: <strong>${t.createdByName}</strong></div>
                        <div class="text-base font-bold text-slate-900 tabular-currency pt-1">${formatIDR(t.amount)}</div>
                      </div>

    function approveTransaction(txId) {
      const tx = DB.transactions.find(t => t.id === txId && t.organization_id === DB.activeOrgId);
      const role = getCurrentRole();
      if (!tx) return;
      if (!hasPermission('transactions.approve')) { showToast('Akses ditolak: Anda tidak memiliki izin menyetujui transaksi.', 'error'); return; }
      if (tx.createdBy === role.userId) { showToast('Pelanggaran Pemisahan Tugas: Anda tidak dapat menyetujui transaksi Anda sendiri.', 'error'); return; }
      tx.status = 'Approved';
      tx.approvedBy = role.userId; tx.approvedByName = role.userName;
      tx.approvedAt = new Date().toLocaleDateString('id-ID') + ' ' + new Date().toTimeString().slice(0,5) + ' WIB';
      logAudit('transaction.approved', `Menyetujui transaksi ${tx.reference} senilai ${formatIDR(tx.amount)}`);
      showToast(`Transaksi ${tx.reference} disetujui dan masuk ke laporan keuangan.`, 'success');
      renderApp();
    }

    function openRejectModal(txId) {
      openModal(`
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">Tolak Transaksi</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">✕</button>
        </div>
        <form onsubmit="confirmRejectTransaction(event, '${txId}')" class="p-6 space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Alasan Penolakan (Wajib) *</label>
            <textarea id="reject-reason" required rows="3" placeholder="Contoh: Lampiran kuitansi vendor belum sesuai dengan nilai tagihan..." class="w-full rounded-xl border border-slate-300 p-3 text-sm"></textarea>
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="rounded-xl border border-slate-300 px-4 py-2 text-xs font-semibold text-slate-700">Batal</button>
            <button type="submit" class="rounded-xl bg-rose-600 px-4 py-2 text-xs font-semibold text-white hover:bg-rose-700 transition">Konfirmasi Penolakan</button>
          </div>
        </form>
      `);
    }

    function confirmRejectTransaction(e, txId) {
      e.preventDefault();
      const tx = DB.transactions.find(t => t.id === txId && t.organization_id === DB.activeOrgId);
      const role = getCurrentRole();
      const reason = document.getElementById('reject-reason').value.trim();
      if (!tx || !reason) return;
      tx.status = 'Rejected'; tx.rejectionReason = reason;
      tx.approvedBy = role.userId; tx.approvedByName = role.userName;
      tx.approvedAt = new Date().toLocaleDateString('id-ID') + ' ' + new Date().toTimeString().slice(0,5) + ' WIB';
      logAudit('transaction.rejected', `Menolak transaksi ${tx.reference}. Alasan: ${reason}`);
      closeModal();
      showToast(`Transaksi ${tx.reference} ditolak.`, 'warning');
      renderApp();
    }

    function submitAccount(e, editId) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('acc-name').value.trim(),
        type: document.getElementById('acc-type').value,
        number: document.getElementById('acc-number').value.trim(),
        openingBalance: Number(document.getElementById('acc-opening').value) || 0
      };
      if (editId) {
        Object.assign(DB.accounts.find(a => a.id === editId), payload);
        showToast('Rekening berhasil diperbarui.', 'success');
      } else {
        DB.accounts.push({ id: 'acc_' + Date.now(), organization_id: DB.activeOrgId, ...payload });
        showToast('Rekening baru berhasil ditambahkan.', 'success');
      }
      closeModal(); renderApp();
    }

    function deleteAccount(accId) {
      const acc = DB.accounts.find(a => a.id === accId);
      if (!acc) return;
      const bal = computeAccountBalance(acc.id);
      const hasTx = DB.transactions.some(t => t.accountId === accId) || DB.transfers.some(tr => tr.fromAccountId === accId || tr.toAccountId === accId);
      if (hasTx) { showToast('Rekening tidak dapat dihapus karena masih memiliki transaksi terkait.', 'error'); return; }
      if (bal !== 0) { showToast('Rekening tidak dapat dihapus karena saldo tidak nol.', 'error'); return; }
      confirmDialog('Hapus Rekening', `Anda akan menghapus <strong>${acc.name}</strong>.`, () => {
        DB.accounts = DB.accounts.filter(a => a.id !== accId);
        showToast('Rekening dihapus.', 'warning');
        renderApp();
      }, 'Ya, Hapus');
    }

    function submitInternalTransfer(e) {
      e.preventDefault();
      const fromId = document.getElementById('trf-from').value;
      const toId = document.getElementById('trf-to').value;
      const amount = Number(document.getElementById('trf-amount').value);
      const note = document.getElementById('trf-note').value;
      if (fromId === toId) { showToast('Rekening sumber dan tujuan tidak boleh sama.', 'error'); return; }
      if (computeAccountBalance(fromId) < amount) { showToast('Saldo rekening sumber tidak mencukupi.', 'error'); return; }
      const ref = 'TRF-' + new Date().getFullYear() + '11-00' + (DB.transfers.length + 1);
      DB.transfers.unshift({
        id: 'trf_' + Date.now(), organization_id: DB.activeOrgId,
        fromAccountId: fromId, toAccountId: toId, amount,
        date: new Date().toLocaleDateString('id-ID'), reference: ref, note
      });
      logAudit('account.transfer', `Transfer internal ${ref} sebesar ${formatIDR(amount)}`);
      closeModal();
      showToast(`Transfer internal ${ref} berhasil.`, 'success');
      renderApp();
    }

    function openRecordPaymentModal(invId) {
      const inv = DB.invoices.find(i => i.id === invId);

      const grand = inv.subtotal * (1 + inv.taxRate / 100);
      const remaining = Math.max(0, grand - inv.paidAmount);
      openModal(`
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">Catat Pembayaran ${inv.number}</h3>

    function submitInvoicePayment(e, invId) {
      e.preventDefault();
      const inv = DB.invoices.find(i => i.id === invId);
      const amount = Number(document.getElementById('pay-amount').value);
      const grand = inv.subtotal * (1 + inv.taxRate / 100);
      inv.paidAmount += amount;

      logAudit('invoice.payment_recorded', `Mencatat pembayaran ${formatIDR(amount)} untuk ${inv.number}`);
      closeModal();
      showToast(`Pembayaran ${formatIDR(amount)} tercatat. Status: ${inv.status}.`, 'success');
      renderApp();

                      <div class="flex items-center gap-2">

                        ${hasPermission('budgets.manage') ? `<button onclick="openEditBudgetModal('${b.id}')" class="rounded-lg border border-slate-300 px-2 py-0.5 text-[11px] font-semibold text-slate-700 hover:bg-slate-50">Edit</button>` : ''}

    // ---- ACCOUNTING ----
    function renderAccounting() {
      if (!hasPlanFeature('doubleEntry')) {
        const org = getCurrentOrg();
        return `<div class="rounded-2xl border border-amber-300 bg-amber-50 p-6 space-y-3">
          <h2 class="text-lg font-bold text-amber-950">Fitur Akuntansi Double-Entry Terkunci</h2>
          <p class="text-sm text-amber-900">Paket <strong>${SUBSCRIPTION_PLANS[org.planCode].name}</strong> tidak mencakup Jurnal Umum & Neraca Saldo otomatis.</p>
          <button onclick="navigate('settings')" class="rounded-xl bg-[#0B132B] px-4 py-2 text-xs font-semibold text-white">Kelola Paket</button>
        </div>`;
      }
      const approvedTxs = getOrgTransactions().filter(t => t.status === 'Approved');
      const transfers = getOrgTransfers();
      const journals = [];
      approvedTxs.forEach(t => {
        const acc = DB.accounts.find(a => a.id === t.accountId);
        const accName = acc ? `1101 - ${acc.name}` : '1101 - Kas & Bank';
        if (t.type === 'income') {
          journals.push({ date: t.date, ref: 'JRN-' + t.reference, desc: t.description, lines: [
            { account: accName, debit: t.amount, credit: 0 },
            { account: `4101 - ${t.category}`, debit: 0, credit: t.amount }
          ]});
        } else {
          journals.push({ date: t.date, ref: 'JRN-' + t.reference, desc: t.description, lines: [
            { account: `5101 - ${t.category}`, debit: t.amount, credit: 0 },
            { account: accName, debit: 0, credit: t.amount }
          ]});
        }
      });
      transfers.forEach(tr => {
        const fromAcc = DB.accounts.find(a => a.id === tr.fromAccountId);
        const toAcc = DB.accounts.find(a => a.id === tr.toAccountId);
        journals.push({ date: tr.date, ref: 'JRN-' + tr.reference, desc: `Transfer Internal: ${tr.note}`, lines: [
          { account: `1102 - ${toAcc?.name || 'Kas Tujuan'}`, debit: tr.amount, credit: 0 },
          { account: `1101 - ${fromAcc?.name || 'Kas Sumber'}`, debit: 0, credit: tr.amount }
        ]});
      });
      const totalDebit = journals.reduce((s, j) => s + j.lines.reduce((x, l) => x + l.debit, 0), 0);
      const totalCredit = journals.reduce((s, j) => s + j.lines.reduce((x, l) => x + l.credit, 0), 0);
      return `
        <div>
          <div class="text-xs font-medium text-slate-500">Modul I / Pembukuan Berpasangan (Double-Entry)</div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-900 mt-0.5">Jurnal Umum & Neraca Saldo</h1>
        </div>
        <div class="rounded-2xl border border-emerald-200 bg-emerald-50/60 p-4 flex flex-wrap items-center justify-between gap-4">
          <div class="text-xs sm:text-sm font-semibold text-emerald-950">Status: ${totalDebit === totalCredit ? '✓ SEIMBANG (BALANCED)' : '✕ TIDAK SEIMBANG'}</div>
          <div class="flex gap-6 text-xs sm:text-sm tabular-currency">
            <span>Total Debit: <strong>${formatIDR(totalDebit)}</strong></span>
            <span>Total Kredit: <strong>${formatIDR(totalCredit)}</strong></span>
          </div>
        </div>
        <div class="space-y-4">
          ${journals.length === 0
            ? `<div class="rounded-2xl border border-slate-200 bg-white p-8 text-center text-sm text-slate-500">Belum ada jurnal dari transaksi yang disetujui.</div>`
            : journals.map(j => `
              <div class="rounded-2xl border border-slate-200 bg-white overflow-hidden">
                <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-200 flex flex-wrap justify-between text-xs">
                  <span class="font-bold text-slate-900">${j.date} • <span class="font-mono text-teal-700">${j.ref}</span> — ${j.desc}</span>
                  <span class="rounded bg-emerald-100 px-2 py-0.5 text-[10px] font-semibold text-emerald-800">Posted</span>
                </div>
                <table class="w-full text-xs sm:text-sm">
                  <tbody class="divide-y divide-slate-100">
                    ${j.lines.map(l => `<tr>
                      <td class="py-2.5 px-4 ${l.credit > 0 ? 'pl-10 text-slate-600' : 'font-medium text-slate-900'}">${l.account}</td>
                      <td class="py-2.5 px-4 text-right tabular-currency w-40">${l.debit > 0 ? formatIDR(l.debit) : '-'}</td>
                      <td class="py-2.5 px-4 text-right tabular-currency w-40">${l.credit > 0 ? formatIDR(l.credit) : '-'}</td>
                    </tr>`).join('')}
                  </tbody>
                </table>
              </div>`).join('')}
        </div>
      `;
    }

      return `

            </div>
            <div class="space-y-2 text-xs sm:text-sm">
              <div class="font-bold text-slate-700">PENDAPATAN USAHA</div>
              ${revItems.length === 0 ? `<div class="text-slate-400 pl-3 italic">Belum ada pendapatan.</div>` : revItems.map(r => `
                <div class="flex justify-between pl-3 text-slate-600"><span class="truncate">${r.description}</span><span class="tabular-currency whitespace-nowrap ml-2">${formatIDR(r.amount)}</span></div>
              `).join('')}
              <div class="flex justify-between font-bold text-emerald-700 pt-1 border-t border-slate-100"><span>Total Pendapatan</span><span class="tabular-currency">${formatIDR(totalRev)}</span></div>
            </div>
            <div class="space-y-2 text-xs sm:text-sm pt-2">
              <div class="font-bold text-slate-700">BEBAN OPERASIONAL</div>
              ${expItems.length === 0 ? `<div class="text-slate-400 pl-3 italic">Belum ada beban.</div>` : expItems.map(e => `
                <div class="flex justify-between pl-3 text-slate-600"><span class="truncate">${e.description}</span><span class="tabular-currency whitespace-nowrap ml-2">${formatIDR(e.amount)}</span></div>
              `).join('')}
              <div class="flex justify-between font-bold text-rose-700 pt-1 border-t border-slate-100"><span>Total Beban</span><span class="tabular-currency">(${formatIDR(totalExp)})</span></div>
            </div>
            <div class="rounded-xl bg-slate-900 p-4 text-white flex justify-between items-center">
              <span class="text-xs sm:text-sm font-semibold">LABA BERSIH</span>
              <span class="text-base sm:text-lg font-bold tabular-currency">${formatIDR(netIncome)}</span>
            </div>
          </div>
          <div class="rounded-2xl border border-slate-200 bg-white p-6 space-y-4">
            <div class="border-b border-slate-200 pb-3">
              <h2 class="text-base font-bold text-slate-900">Neraca Keuangan (Balance Sheet)</h2>
              <p class="text-xs text-slate-500">Aset = Liabilitas + Ekuitas</p>
            </div>
            <div class="space-y-2 text-xs sm:text-sm">
              <div class="font-bold text-slate-700">ASET LANCAR</div>
              ${accounts.map(a => `<div class="flex justify-between pl-3 text-slate-600"><span class="truncate">${a.name}</span><span class="tabular-currency whitespace-nowrap ml-2">${formatIDR(computeAccountBalance(a.id))}</span></div>`).join('')}
              <div class="flex justify-between font-bold text-slate-900 pt-1 border-t border-slate-100"><span>Total Aset</span><span class="tabular-currency">${formatIDR(totalCashAssets)}</span></div>
            </div>
            <div class="space-y-2 text-xs sm:text-sm pt-2">
              <div class="font-bold text-slate-700">EKUITAS</div>
              <div class="flex justify-between pl-3 text-slate-600"><span>Modal Disetor & Saldo Awal</span><span class="tabular-currency">${formatIDR(openingEquity)}</span></div>
              <div class="flex justify-between pl-3 text-slate-600"><span>Laba Ditahan Periode Berjalan</span><span class="tabular-currency">${formatIDR(netIncome)}</span></div>
              <div class="flex justify-between font-bold text-slate-900 pt-1 border-t border-slate-100"><span>Total Ekuitas</span><span class="tabular-currency">${formatIDR(openingEquity + netIncome)}</span></div>
            </div>
          </div>
        </div>

                  <td class="py-3.5 px-4 font-semibold uppercase">${o.planCode}</td>
                  <td class="py-3.5 px-4">${renderStatusBadge(o.subscriptionStatus)}</td>
                  <td class="py-3.5 px-4 text-right text-xs font-mono text-slate-400">ENCRYPTED / RLS ISOLATED</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ---- NEW ORG MODAL ----
    function openNewOrgModal() {
      openModal(`
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
          <h3 class="text-base font-bold text-slate-900">Buat Organisasi Baru</h3>
          <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700">✕</button>
        </div>
        <form onsubmit="submitNewOrganization(event)" class="p-6 space-y-4 text-sm">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Perusahaan *</label>
            <input id="new-org-name" type="text" required placeholder="PT Maju Karya Mandiri" class="w-full rounded-xl border border-slate-300 px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Bidang Industri *</label>
            <input id="new-org-industry" type="text" required placeholder="Agensi Digital / Perdagangan" class="w-full rounded-xl border border-slate-300 px-3 py-2" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Paket Awal</label>
            <select id="new-org-plan" class="w-full rounded-xl border border-slate-300 px-3 py-2">
              <option value="free">Free (Rp 0/bulan)</option>
              <option value="starter" selected>Starter (Rp 49.000/bulan)</option>
              <option value="pro">Pro (Rp 149.000/bulan)</option>
              <option value="business">Business (Rp 349.000/bulan)</option>
            </select>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="rounded-xl border border-slate-300 px-4 py-2 text-xs font-semibold">Batal</button>
            <button type="submit" class="rounded-xl bg-[#0B132B] px-4 py-2 text-xs font-semibold text-white hover:bg-[#1C2541] transition">Buat Ruang Kerja</button>
          </div>
        </form>
      `);
    }

    function submitNewOrganization(e) {
      e.preventDefault();
      const name = document.getElementById('new-org-name').value.trim();
      const industry = document.getElementById('new-org-industry').value.trim();
      const planCode = document.getElementById('new-org-plan').value;
      const newId = 'org_' + Date.now();
      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      DB.organizations.push({ id:newId, name, slug, npwp:'-', industry, planCode, subscriptionStatus: planCode === 'free' ? 'active' : 'trialing', periodEnd:'15/12/2026' });
      DB.accounts.push({ id:'acc_' + Date.now(), organization_id:newId, name:'Kas Utama Operasional', type:'Cash', number:'CASH-INIT', openingBalance:0 });
      DB.activeOrgId = newId;
      DB.currentRoute = 'dashboard';
      closeModal();
      showToast(`Organisasi "${name}" berhasil dibuat.`, 'success');
      renderApp();
    }

    // =========================================================================
    // 7. MAIN DISPATCHER
    // =========================================================================
    function renderApp() {
      // Permission guard: if route no longer accessible
      const nav = NAV_ITEMS.find(n => n.id === DB.currentRoute);
      if (nav && nav.permission && !hasPermission(nav.permission)) DB.currentRoute = 'dashboard';

      renderShell();
      const routes = {
        dashboard: renderDashboard, transactions: renderTransactions, approvals: renderApprovals,
        cash_bank: renderCashBank, invoices: renderInvoices, projects: renderProjects,
        budgets: renderBudgets, accounting: renderAccounting, reports: renderReports,
        settings: renderSettings, super_admin: renderSuperAdmin
      };
      const main = document.getElementById('main-content');
      const renderer = routes[DB.currentRoute] || renderDashboard;
      main.innerHTML = renderer();
      main.classList.remove('animate-fade-in');
      void main.offsetWidth;
      main.classList.add('animate-fade-in');
    }

    window.addEventListener('DOMContentLoaded', renderApp);
  </script>
</body>
</html>
